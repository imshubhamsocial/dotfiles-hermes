model:
  default: gemma-4-4b
  provider: custom
  base_url: http://127.0.0.1:8138/v1
  context_length: 65536
database:
  journal_mode: wal
telemetry:
  enabled: true
  provider: openlit
  otlp_endpoint: http://127.0.0.1:4318
  export_spans: true
terminal:
  backend: local
  cwd: .
  timeout: 180
thinking_budget:
  enabled: true
  default_budget: 2048
  complexity_budgets:
    0: 0
    1: 512
    2: 2048
    3: 8192
  min_confidence: 0.85
  max_critique_rounds: 3
  hide_thinking_tokens: true
  cot_buffer_path: ~/.hermes/memories/evolution/cot_rl_buffer.jsonl
plugins:
  enabled:
  - adk_orchestrator
  - agent_os
  - agentshield
  - bpe_workspace
  - branch_swapper
  - cactus_uncertainty
  - capability_guard
  - cog_verifier
  - context_budget_manager
  - demo_validator
  - embedding_gemma
  - gepa_optimizer
  - mcp_tools
  - nemo_guardrails
  - observer_gate
  - openskills
  - quorum_audit
  - recirculation_adapter
  - reflective_learner_adapter
  - reward_scorer
  - self_evolution
  - skill_intelligence
  - symbol_index
  - synergy_bus_adapter
  - trajectory_recorder
  - antigravity_bridge
  - cua_bridge
  - vision_sidecar
  disabled: []
  entries:
    adk_orchestrator:
      allow_tool_override: false
    agent_os:
      allow_tool_override: false
    branch_swapper:
      allow_tool_override: false
    cactus_uncertainty:
      allow_tool_override: false
    capability_guard:
      allow_tool_override: false
    cog_verifier:
      allow_tool_override: false
    demo_validator:
      allow_tool_override: false
    embedding_gemma:
      allow_tool_override: false
    gepa_optimizer:
      allow_tool_override: false
    mcp_tools:
      allow_tool_override: false
    nemo_guardrails:
      allow_tool_override: false
    observer_gate:
      allow_tool_override: false
    openskills:
      allow_tool_override: false
    quorum_audit:
      allow_tool_override: false
    recirculation_adapter:
      allow_tool_override: false
    reflective_learner_adapter:
      allow_tool_override: false
    symbol_index:
      allow_tool_override: false
    synergy_bus_adapter:
