# ~/.hermes/config.yaml — Canonical Zero-Custom-Code Hermes Agent OS Configuration

_config_version: 44
model:
  provider: local-llama
  default: nemotron-3.5-bolt-e4b
  base_url: http://127.0.0.1:8138/v1
  context_length: 131072

providers:
  local-llama:
    api: http://127.0.0.1:8138/v1
    api_key_env: LOCAL_LLAMA_API_KEY
    stale_timeout_seconds: 120
    models:
      gemma-4-E4B-it-qat:
        context_length: 131072
        max_output_tokens: 4096
      gemma-4-E4B-it-qat-exact:
        context_length: 131072
        max_output_tokens: 4096
      nemotron-3.5-bolt-e4b:
        context_length: 131072
        max_output_tokens: 4096
  local-embedding-cpu:
    api: http://127.0.0.1:8139/v1
    api_key_env: LOCAL_EMBEDDING_API_KEY
    models:
      embeddinggemma-2-q8_0:
        context_length: 8192
        dimensions: 768

# Declarative Fix for Upstream Issues #56360 & #81670 (Eliminates Tool Text Leaks & Verification Loops)
agent:
  tool_use_enforcement: false
  execution_guidance: false
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  max_turns: 25

# Declarative Fix for Upstream Issues #28825 & #144082 (Preserves Bare Model Overrides on Port 8642)
gateway:
  host: 127.0.0.1
  port: 8642
  platforms:
    api_server:
      enabled: true
      extra:
        direct_model_requests: true

# Upstream Tiered Tool Search (Set "off" during external benchmark gauntlets)
tools:
  tool_search:
    enabled: "off"
    threshold_pct: 4
    listing_max_tokens: 1200

# Upstream Native LSP Diagnostics
lsp:
  enabled: true
  servers:
    pyright:
      disabled: false

# Official OpenViking Hierarchical Memory Plugin (Port 1933)
memory:
  provider: openviking
  openviking:
    url: http://127.0.0.1:1933
    embedding_provider: local-embedding-cpu
    embedding_model: embeddinggemma-2-q8_0
    matryoshka_dim: 256

approvals:
  mode: "off"

skills:
  ledger: true
  ledger_max_bytes: 5242880
  write_approval: false
  external_dirs:
    - ~/.agents/skills
    - ~/.hermes/skills

curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 14
  archive_after_days: 30
  consolidate: true
  prune_builtins: false
  archive_ttl_days: 180

auxiliary:
  curator:
    provider: local-llama
    model: gemma-4-E4B-it-qat
    timeout: 600

plugins:
  enabled:
    - openviking
    - jev-curator
  entries:
    jev-curator:
      settings:
        mode: guard
        provider: custom
        allow_content_egress: false
        timeout_seconds: 25
        max_requests: 50
        max_pairs: 100
        top_k: 5
