database:
  journal_mode: wal
model:
  default: gemma-4-4b
  provider: custom
  base_url: http://127.0.0.1:8138/v1
  context_length: 65536
auxiliary:
  compression:
    context_length: 65536
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
plugins:
  enabled:
  - quorum_audit
  - gepa_optimizer
  - observer_gate
  - cog_verifier
  - agent_os
  - symbol_index
  - recirculation_adapter
  - reflective_learner_adapter
  - synergy_bus_adapter

