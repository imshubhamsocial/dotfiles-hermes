# ~/.hermes/config.yaml — Canonical Zero-Custom-Code Hermes Agent OS Configuration (GDR28)

model:
  provider: local-llama
  default: gemma-4-E4B-it-qat
  base_url: http://127.0.0.1:8138/v1
  context_length: 32768

providers:
  local-llama:
    api: http://127.0.0.1:8138/v1
    api_key_env: LOCAL_LLAMA_API_KEY
    stale_timeout_seconds: 120
    models:
      gemma-4-E4B-it-qat:
        context_length: 32768
        max_output_tokens: 4096
      nemotron-3.5-bolt-e4b:
        context_length: 32768
        max_output_tokens: 4096
  local-embedding-cpu:
    api: http://127.0.0.1:8139/v1
    api_key_env: LOCAL_EMBEDDING_API_KEY
    models:
      embeddinggemma-2-q8_0:
        context_length: 8192
        dimensions: 768

# Declarative Fix for Upstream Issue #56360 (Eliminates 30-60% Tool Text Leaks on 4B QAT Models)
agent:
  tool_use_enforcement: false
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  max_turns: 25

# Declarative Fix for Upstream Issue #28825 (Preserves Client-Supplied Tools & Bare Model Overrides on Port 8642)
gateway:
  host: 127.0.0.1
  port: 8642
  platforms:
    api_server:
      enabled: true
      extra:
        direct_model_requests: true

# Upstream Tiered BM25 Tool Search (Replaces hermes_abductive_fastmcp.py)
# Note: Set enabled: "off" during UK AISI Inspect AI benchmark runs so external benchmark tools are not deferred
tools:
  tool_search:
    enabled: "on"
    threshold_pct: 4
    listing_max_tokens: 1200

# Upstream In-Process AST + Pyright LSP Diagnostics (Replaces hermes_ast_canonizer.py)
lsp:
  enabled: true
  servers:
    pyright:
      disabled: false

# Official OpenViking Hierarchical Memory Plugin (Port 1933, Replaces hermes_stair_retriever.py)
memory:
  provider: openviking
  openviking:
    url: http://127.0.0.1:1933
    embedding_provider: local-embedding-cpu
    embedding_model: embeddinggemma-2-q8_0
    matryoshka_dim: 256

# Upstream Native Skill Curator & Append-Only Audit Ledger (Replaces hermes_skill_distiller.py & skill_evaluator.py)
skills:
  ledger: true
  ledger_max_bytes: 5242880
  write_approval: false
  external_dirs:
    - ~/.agents/skills

curator:
  enabled: true
  interval_hours: 168
  min_idle_hours: 2
  stale_after_days: 14
  archive_after_days: 30
  consolidate: true
  prune_builtins: false
  archive_ttl_days: 180

auxiliary:
  curator:
    provider: local-llama
    model: gemma-4-E4B-it-qat
    timeout: 600

# Official Catalog Plugins (Zero Custom Python Code)
plugins:
  enabled:
    - openviking
    - jev-curator
  entries:
    jev-curator:
      settings:
        mode: guard                  # "off" | observe | guard | apply
        provider: custom             # Uses local/configured endpoint; guard mode has 0 network overhead
        allow_content_egress: false  # Strictly enforces 100% local privacy ($0 API cost)
        timeout_seconds: 25
        max_requests: 50
        max_pairs: 100
        top_k: 5
