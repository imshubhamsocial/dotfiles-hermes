colang_version: "1.0"

models:
  - type: main
    engine: openai
    model: dory
    parameters:
      base_url: "http://127.0.0.1:8138/v1"
      api_key: "hermes-local"
      temperature: 0.2

rails:
  config:
    user_messages:
      embeddings_only: true
  dialog:
    single_call:
      enabled: true
      fallback_to_multiple_calls: false
  input:
    flows:
      - check input entropy and injection
  retrieval:
    flows:
      - check retrieved context integrity
  execution:
    flows:
      - enforce u12 diff and tabu execution rail
  output:
    flows:
      - verify epistemic closure and non vacuous receipt
