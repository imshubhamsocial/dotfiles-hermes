tasks:
  - id: ast_syntax_check
    title: "Verify Python AST syntax"
    prompt: "Check whether the following code has invalid syntax: 'def bad(x: return x'"
    skill: "devops/observer-gate"
    expected_contains: "syntax error"
  - id: git_status_check
    title: "Examine repository status"
    prompt: "Show the clean/dirty status of current git worktree"
    skill: "github/github-repo-management"
    expected_contains: "branch"
  - id: html_ui_check
    title: "Validate Generative UI HTML structure"
    prompt: "Validate if this artifact is valid HTML5: '<!DOCTYPE html><html><head><title>App</title></head><body><h1>Hello</h1></body></html>'"
    skill: "software-development/generative-ui-artifact"
    expected_contains: "valid"
  - id: bug_investigation
    title: "Systematic debugging of off-by-one"
    prompt: "Analyze loop: for i in range(len(arr) + 1): val = arr[i]. Identify bug and fix."
    skill: "software-development/systematic-debugging"
    expected_contains: "IndexError"
  - id: fastmcp_tool_query
    title: "Query MCP server tools"
    prompt: "Describe how FastMCP registers tools via python decorators."
    skill: "software-development/hermes-agent-skill-authoring"
    expected_contains: "@mcp.tool"
