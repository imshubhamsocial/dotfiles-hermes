# Hermes Agent OS — Security & Capability Policy (Roadmap 6 - Milestone 1)
# Enforces containment boundaries, credential masking, and transcript immutability.

version: "1.0.0"
environment: "ws-hermes"

network:
  allow_outbound: true
  deny_hosts:
    - "127.0.0.1:22"
    - "localhost:22"
    - "0.0.0.0:22"
  deny_ports: [22, 3306, 5432, 27017, 6379] # Disallow raw db / ssh injection from subagent shells
  audit_external_calls: true

filesystem:
  deny_write_paths:
    - "~/.hermes/logs/*.integrity"     # Audit hashes are strictly append/read-only
    - "~/.git-credentials"             # Credential vaults are read-only
    - "~/.ssh/id_*"                    # Private keys are read-only
    - "/etc/shadow"
    - "/etc/sudoers"
  protected_files:
    - "~/.hermes/SOUL.md"
    - "~/.hermes/policy/agent_capabilities.yaml"
  sandbox_isolation:
    enforce_workspace_confinement: true
    workspace_root: "~/Projects/Workspace/Personal/hermes"

credentials:
  env_var_passthrough: false
  mask_patterns:
    - "ghp_[A-Za-z0-9_]{36}"
    - "gho_[A-Za-z0-9_]{36}"
    - "xox[baprs]-[A-Za-z0-9-]+"
    - "sk-[A-Za-z0-9-_]{32,}"
  deny_exposure_in_prompts: true

transcript:
  immutable: true
  hash_on_write: true
  hash_algorithm: "sha256"
  sidecar_extension: ".integrity"
  fail_on_mismatch: true
