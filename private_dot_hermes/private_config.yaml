database:
  journal_mode: wal
display:
  interface: tui
  personality: ''
  final_response_markdown: render
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: concise
  sections:
    thinking: collapsed
    tools: expanded
    activity: hidden
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: true
  streaming: true
  skin: default
runtime:
  nofile_soft_limit: 4096
model:
  default: google/gemma-4-E4B-it
  provider: custom
  base_url: http://127.0.0.1:8138/v1
  context_length: 131072
custom_providers:
  - name: omniroute
    base_url: http://localhost:20128/v1
    api_key: sk-nadia-master
    display_name: OmniRoute Gateway
    models: {}
  - name: opencode
    base_url: http://127.0.0.1:20129/v1
    api_key: sk-opencode-local
    display_name: OpenCode CLI Bridge
    models: {}
  - name: freellmapi
    base_url: http://localhost:3001/v1
    api_key: freellmapi-5b132111b512a8e8eb3b2d7c4ddb35f969f0484968cedd59
    display_name: FreeLLMAPI Gateway
    models: {}
  - name: kaggle
    base_url: http://127.0.0.1:20130/v1
    api_key: sk-kaggle-local
    display_name: Kaggle Cloud GPU (NVIDIA Tesla P100)
    models:
      gemma4:A12B:
        context_length: 131072
      gemma-4-12b:
        context_length: 131072
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
web:
  backend: ""
  search_backend: ""
  extract_backend: ""
  searxng_url: http://127.0.0.1:8080
  fallback_search_backend: ""
  timeout_seconds: 12
  verify_ssl: true
tool_output:
  max_bytes: 3500
  max_lines: 100
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 2
    same_tool_failure: 4
    idempotent_no_progress: 3
  loop_caps:
    per_tool:
      tool_search: 3
compression:
  enabled: true
  threshold: 0.70
  target_ratio: 0.18
  protect_last_n: 24
  tail_token_budget: 32768
prompt_caching:
  cache_ttl: 5m
memory:
  provider: openviking
  memory_enabled: true
  session_search: true
  user_profile_enabled: true
  memory_char_limit: 8000
  user_char_limit: 1375
  nudge_interval: 10
  openviking:
    agent: hermes-ws
group_sessions_per_user: true
streaming:
  enabled: true
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 10000
  verbose: true
  reasoning_effort: medium
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
telemetry:
  otlp_endpoint: http://127.0.0.1:4318
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
plugins:
  enabled: []
_config_version: 44
monitoring:
  gateway_health_export:
    enabled: true
  export:
    otlp:
      enabled: true
      endpoint: http://127.0.0.1:4318
tools:
  semgrep:
    enabled: true
  reviewdog:
    enabled: true
  tool_search:
    enabled: "off"
    threshold_pct: 15
    defer: []
  disabled_toolsets:
    - feishu
    - desktop_preview
    - gui_tour
    - video_analyze
    - browser_vault
mcp_servers:
  openjev:
    command: python3.13
    args:
      - ${userHome}/.hermes/mcp_openjev.py
    env:
      LLAMA_SERVER_URL: http://127.0.0.1:8138
      HERMES_VISION_URL: http://127.0.0.1:8139
      OPENVIKING_URL: http://127.0.0.1:1933
      OPENJEV_VIKING_URL: http://127.0.0.1:1933
      CHROME_CDP_URL: http://127.0.0.1:9222
      CUDA_VISIBLE_DEVICES: ''
      TMPDIR: /tmp
  cua_driver:
    command: ${userHome}/.local/bin/cua-driver
    args:
      - mcp
    env:
      CUA_SOCKET_PATH: /tmp/hermes_cua_driver.sock
      CUA_DEFAULT_INCLUDE_SCREENSHOT: 'false'
      CUA_TELEMETRY_DISABLED: '1'
      WAYLAND_DISPLAY: wayland-0
      DISPLAY: :0
      CUDA_VISIBLE_DEVICES: ''
      TMPDIR: /tmp
  playwright_cdp:
    command: npx
    args:
      - '@playwright/mcp@latest'
      - --cdp-endpoint
      - http://127.0.0.1:9222
    env:
      CUDA_VISIBLE_DEVICES: ''
  open-notebook:
    command: uvx
    args:
      - --with
      - mcp<2
      - open-notebook-mcp
    env:
      OPEN_NOTEBOOK_API_URL: http://127.0.0.1:5055
      CUDA_VISIBLE_DEVICES: ''
    enabled: false
    lazy: true
onboarding:
  seen:
    tool_progress_prompt: true
