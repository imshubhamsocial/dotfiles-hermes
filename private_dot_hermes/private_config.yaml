database:
  journal_mode: wal
display:
  interface: tui
  final_response_markdown: render
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: concise
  sections:
    thinking: hidden
    tools: expanded
    activity: hidden
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  streaming: true
  skin: default
runtime:

  nofile_soft_limit: 4096
model:
  default: "dory"
  provider: "custom"
  base_url: "http://127.0.0.1:8138/v1"
  context_length: 262144
custom_providers:
  - name: omniroute
    base_url: http://localhost:20128/v1
    api_key: sk-nadia-master
    display_name: OmniRoute Gateway
    models: {}
  - name: opencode
    base_url: http://127.0.0.1:20129/v1
    api_key: sk-opencode-local
    display_name: OpenCode CLI Bridge
    models: {}
  - name: freellmapi
    base_url: http://localhost:3001/v1
    api_key: freellmapi-5b132111b512a8e8eb3b2d7c4ddb35f969f0484968cedd59
    display_name: FreeLLMAPI Gateway
    models: {}
  - name: kaggle
    base_url: http://127.0.0.1:20130/v1
    api_key: sk-kaggle-local
    display_name: Kaggle Cloud GPU (NVIDIA Tesla P100)
    models:
      "gemma4:A12B":
        context_length: 65536
      "gemma-4-12b":
        context_length: 65536
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_output:
  max_bytes: 3500
  max_lines: 100
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 2
    same_tool_failure: 4
    idempotent_no_progress: 3
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  provider: openviking
  memory_enabled: true
  session_search: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  openviking:
    agent: hermes-ws
group_sessions_per_user: true
streaming:
  enabled: true
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 500
  verbose: true
  reasoning_effort: medium
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
plugins:
  enabled: []
_config_version: 44

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

monitoring:
  gateway_health_export:
    enabled: true
  export:
    otlp:
      enabled: true
      endpoint: "http://127.0.0.1:4318"

telemetry:
  otlp_endpoint: "http://127.0.0.1:4318"

tools:
  semgrep:
    enabled: true
  reviewdog:
    enabled: true



mcp_servers:
  openjev:
    command: "python3.13"
    args:
      - "${userHome}/.hermes/mcp_openjev.py"
    env:
      LLAMA_SERVER_URL: "http://127.0.0.1:8138"
      CUDA_VISIBLE_DEVICES: ""
  open-notebook:
    command: "uvx"
    args:
      - "open-notebook-mcp"
    env:
      OPEN_NOTEBOOK_API_URL: "http://127.0.0.1:5055"
      CUDA_VISIBLE_DEVICES: ""
    disabled: true
    lazy: true
