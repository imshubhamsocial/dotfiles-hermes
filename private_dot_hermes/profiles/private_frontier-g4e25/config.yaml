model:
  provider: custom
  base_url: http://127.0.0.1:8138/v1
  default: gemma-4-4b
skills:
  external_dirs:
    - ~/.hermes/skills
_config_version: 33
mcp_servers:
  codebase-memory:
    command: ~/.local/bin/codebase-memory-mcp
    enabled: true
    env:
      PATH: ~/.local/bin:/usr/local/bin:/usr/bin:/bin
      HOME: ~
  mnemory:
    command: ~/.local/bin/mnemory
    args:
    - serve
    enabled: true
    env:
      LLM_API_KEY: dummy
      LLM_BASE_URL: http://127.0.0.1:8138/v1
      PATH: ~/.local/bin:/usr/local/bin:/usr/bin:/bin
      HOME: ~
  letta:
    command: ~/.local/bin/letta
    enabled: false
    env:
      PATH: ~/.local/bin:/usr/local/bin:/usr/bin:/bin
      HOME: ~
  exa:
    command: exa-mcp-server
    enabled: false
    env:
      EXA_API_KEY: ${EXA_API_KEY}
      PATH: /usr/local/bin:/usr/bin:/bin
      HOME: ~
  claude-context:
    command: claude-context
    enabled: false
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
      HOME: ~
plugins:
  enabled:
  - amd-memory
  - adaptive-thinking
  - frontier-levers
  - compound-tools
  - recency-zone
