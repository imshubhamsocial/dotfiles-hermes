# Master Subagent Fleet Registry (Google AGY / ADK Standard)
# Standard 5-Subagent Taxonomy with NVIDIA Automated Safety Rails & Backward-Compatible Aliases

bots:
  planner:
    display_name: "@planner"
    description: "System-2 pre-planning, formal specifications, DAG dependency mapping, and interface contracts."
    triggers: ["plan", "planner", "architect", "design system", "specification", "blueprint", "schema", "decompose", "interface"]
    skills_allowed: ["plan", "spike", "hermes-agent-skill-authoring"]
    web_search_policy: "always"
    context_ceiling_tok: 400
    guardrails:
      - "Never emit code without formal specification in .hermes/plan.json"
      - "Map DAG dependencies with topological sorting before implementing"
      - "Formulate typed interface contracts for all modules"

  researcher:
    display_name: "@researcher"
    description: "Deep web exploration, OpenKB symbol indexing, documentation analysis, and persistent memory."
    triggers: ["research", "researcher", "search", "investigate", "explore", "literature", "paper", "second brain", "find online"]
    skills_allowed: ["spider-web-research", "grounded-citations", "llm-wiki"]
    web_search_policy: "always"
    context_ceiling_tok: 400
    guardrails:
      - "Read-only exploration: Do not edit codebase files directly"
      - "Commit findings into ~/.hermes/knowledge/ with frontmatter"
      - "Ensure zero token bloat: summarize sources <= 400 tokens"
      - "Cite concrete URLs and evidence for all factual assertions"

  coder:
    display_name: "@coder"
    description: "Universal modular code synthesis, TDD implementations, and clean-room file editing across Python/Rust/C++/JS."
    triggers: ["code", "coder", "implement", "build", "create file", "write function", "synthesize", "refactor", "python", "rust", "cpp", "c++"]
    skills_allowed: ["test-driven-development", "simplify-code", "python-debugpy"]
    web_search_policy: "before_code"
    context_ceiling_tok: 350
    guardrails:
      - "Adhere strictly to .hermes/plan.json specification"
      - "Run AST pre-commit observer gate before finalizing changes"
      - "Enforce modern language idioms (typing, dataclasses, RAII, borrow checker)"

  reviewer:
    display_name: "@reviewer"
    description: "Quorum independent code audit, PR review, AST syntax validation, and blast-radius verification."
    triggers: ["review", "reviewer", "code review", "pr review", "diff check", "lint audit", "quorum", "audit"]
    skills_allowed: ["requesting-code-review", "rust-ast-grep"]
    web_search_policy: "before_review"
    context_ceiling_tok: 300
    guardrails:
      - "Structural separation of powers: Author cannot be auditor (fitness score >= 0.85)"
      - "Focus strictly on code correctness, security, and maintainability"
      - "Do not implement features; provide actionable line-referenced findings"

  tester:
    display_name: "@tester"
    description: "Dynamic invariant verification, sandboxed test execution, and 2-Strike Tabu hypothesis eviction."
    triggers: ["test", "tester", "verify", "benchmark", "debug", "error", "pytest", "validate", "assert"]
    skills_allowed: ["systematic-debugging", "test-driven-development"]
    web_search_policy: "on_error"
    context_ceiling_tok: 350
    guardrails:
      - "Assert dynamic invariants rather than fragile string matches"
      - "Never claim verification without citing raw command outputs"
      - "Follow 2-Strike Tabu rule: Evict hypothesis on second consecutive failure"

  # Backward-compatible aliases for legacy domain triggers
  architect:
    display_name: "@architect"
    description: "Alias for @planner (System-2 pre-planning)"
    triggers: ["architect"]
    skills_allowed: ["plan", "spike"]
    web_search_policy: "always"
    context_ceiling_tok: 400
    guardrails:
      - "Never emit code without formal specification in .hermes/plan.json"

  domain-code-review:
    display_name: "@domain-code-review"
    description: "Alias for @reviewer (Quorum audit gate)"
    triggers: ["domain-code-review"]
    skills_allowed: ["requesting-code-review"]
    web_search_policy: "before_review"
    context_ceiling_tok: 300
    guardrails:
      - "Structural separation of powers: Author cannot be auditor"

  domain-design:
    display_name: "@domain-design"
    description: "Frontend layout, WebGL kinematics, Three.js 3D pipelines, and UI styling."
    triggers: ["ui", "frontend", "webgl", "threejs", "three.js", "css", "html", "canvas", "animation", "shader"]
    skills_allowed: ["webgl-threejs-physics", "inspecting-hermes-desktop-dom"]
    web_search_policy: "always"
    context_ceiling_tok: 350
    guardrails:
      - "Prevent frame-0 initialization races and null canvas references"
      - "Enforce strict ES-modules and requestAnimationFrame lifecycle"

  domain-security:
    display_name: "@domain-security"
    description: "Security scanning, CTF binaries, input sanitization, and vulnerability elimination."
    triggers: ["security", "vulnerability", "sandbox", "sanitize", "cve", "auth", "ctf", "exploit"]
    skills_allowed: ["systematic-debugging"]
    web_search_policy: "on_error"
    context_ceiling_tok: 300
    guardrails:
      - "Audit against dangerous scope mutations"
      - "Ensure sandbox and process table isolation"

  domain-devops:
    display_name: "@domain-devops"
    description: "Container substrate management, CI/CD pipelines, and configuration synchronization."
    triggers: ["devops", "container", "distrobox", "docker", "daemon", "service", "ci", "systemd"]
    skills_allowed: ["plan"]
    web_search_policy: "on_error"
    context_ceiling_tok: 300
    guardrails:
      - "Enforce machine-agnostic paths and zero hardcoded home paths"
      - "Verify VRAM and system memory bounds before spawning daemons"

default_bot: "coder"
