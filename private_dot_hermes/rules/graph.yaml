# Hermes Autonomous Multi-Bot Execution DAG Topology
# Formal Graph Engineering Spec with Typed Edge Contracts & Governance Gates

version: "1.0.0"
graph_name: "standard_engineering_dag"

nodes:
  intake:
    role: "User Intake & Web Grounding"
    bot_class: "researcher"
    output_schema:
      type: object
      required: ["goal", "grounding_evidence"]
      properties:
        goal: { type: string }
        grounding_evidence: { type: array }

  plan:
    role: "System-2 Pre-Planning"
    bot_class: "architect"
    output_schema:
      type: object
      required: ["plan_file", "milestones", "invariants"]
      properties:
        plan_file: { type: string }
        milestones: { type: array }
        invariants: { type: array }

  synthesis:
    role: "TDD Modular Code Synthesis"
    bot_class: "coder"
    output_schema:
      type: object
      required: ["modified_files", "observer_gate_passed"]
      properties:
        modified_files: { type: array }
        observer_gate_passed: { type: boolean }

  verification:
    role: "Dynamic Invariant & Pytest Verification"
    bot_class: "tester"
    output_schema:
      type: object
      required: ["tests_passed", "exit_code"]
      properties:
        tests_passed: { type: integer }
        exit_code: { type: integer }

edges:
  - from: intake
    to: plan
    governance_gate: "web_grounding_verified"

  - from: plan
    to: synthesis
    governance_gate: "spec_first_plan_persisted"

  - from: synthesis
    to: verification
    governance_gate: "observer_gate_6_point"

