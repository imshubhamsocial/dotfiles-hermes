[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-harness"
version = "1.0.0"
description = "Hermes Agent OS Harness -- deterministic agent orchestration with trajectory intelligence"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Hermes Harness Team", email = "hermes@local.dev"}
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "fastmcp>=0.1.0",
    "mcp>=1.0.0",
    "instructor>=1.3.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=0.2.0",
    "sqlmodel>=0.0.18",
    "diskcache>=5.6.3",
    "duckdb>=1.0.0",
    "fastembed>=0.3.0",
    "tiktoken>=0.7.0",
    "pathspec>=0.12.0",
    "ddgs>=9.0.0",
    "nvidia-ml-py>=12.0.0",
    "trafilatura>=1.9.0",
    "crawl4ai>=0.9.0",
    "google-adk>=2.8.0",
    "nemoguardrails>=0.24.0",
    "openlit>=1.45.0",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "playwright>=1.40.0", "black>=23.0.0", "ruff>=0.1.0"]
benchmark = ["numpy>=1.24.0", "matplotlib>=3.7.0"]

[project.urls]
Homepage = "https://github.com/nousresearch/hermes-agent"
Repository = "https://github.com/nousresearch/hermes-agent"


[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".cache",
    ".venv",
    "venv",
    ".hermes_archived",
    ".local_archived",
    ".local",
    ".hermes/hermes-agent",
    ".hermes/skills",
    ".hermes/profiles",
    "tests",
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E501",
    "F841",
    "F401",
    "E731",
    "E741",
]