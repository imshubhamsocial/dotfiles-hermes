<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Aquarium Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #031224; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffff; font-family: 'Courier New', monospace; font-size: 14px; pointer-events: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    </style>
    <!-- Three.js r128 -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <!-- OrbitControls UMD Build -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <div>AQUARIUM SIMULATION</div>
        <div>Drag the yellow ball to interact</div>
        <div>15 Fish | 18 Seaweeds | 60 Bubbles</div>
    </div>
    <script>
        // ==========================================
        // 1. GLOBAL SCOPE CONTRACTS
        // ==========================================
        let scene, camera, renderer, controls, ball, ballVel, isDraggingBall = false;
        let fishes = [], seaweeds = [], bubbles = [];
        
        const TANK = { w: 36, h: 22, d: 24 };
        const WATER_Y = 6;

        // ==========================================
        // 2. SCENE, ATMOSPHERE & LIGHTING
        // ==========================================
        scene = new THREE.Scene();
        // FIX: Updated background color
        scene.background = new THREE.Color(0x062846);
        // FIX: Updated fog color and density
        scene.fog = new THREE.FogExp2(0x062846, 0.015);

        camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 42);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x225588, 1.5); // FIX: Updated ambient color
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xaae5ff, 2.5);
        sunLight.position.set(15, 30, 20); // FIX: Updated position for better angle
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.001; // FIX: Soft shadows
        scene.add(sunLight);

        const bottomLight = new THREE.PointLight(0x00d2ff, 1.5);
        bottomLight.position.set(0, -TANK.h/2, 0);
        scene.add(bottomLight);

        // ==========================================
        // 3. CRYSTAL GLASS TANK & SEABED
        // ==========================================
        const tankGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x99ddff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.05,
            transmission: 0.9,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const tank = new THREE.Mesh(tankGeo, glassMat);
        scene.add(tank);

        // Metallic border lines
        const edges = new THREE.EdgesGeometry(tankGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff });
        const tankLines = new THREE.LineSegments(edges, lineMat);
        tank.add(tankLines);

        // Seabed
        const seabedGeo = new THREE.PlaneGeometry(TANK.w - 0.5, TANK.d - 0.5);
        const seabedMat = new THREE.MeshStandardMaterial({ color: 0xd9b36c, roughness: 0.9 });
        const seabed = new THREE.Mesh(seabedGeo, seabedMat);
        seabed.rotation.x = -Math.PI / 2;
        seabed.position.y = -TANK.h/2 + 0.1;
        seabed.receiveShadow = true;
        scene.add(seabed);

        // ==========================================
        // 4. TRANSLUCENT WATER & RISING BUBBLES
        // ==========================================
        const waterGeo = new THREE.PlaneGeometry(TANK.w - 0.2, TANK.d - 0.2);
        const waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x0088cc,
            transparent: true,
            opacity: 0.55,
            roughness: 0.1,
            transmission: 0.8,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = WATER_Y;
        scene.add(water);

        // Bubbles
        for (let i = 0; i < 60; i++) {
            const bubbleGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const bubbleMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                transmission: 0.2,
                roughness: 0.1
            });
            const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
            bubble.position.set(
                (Math.random() - 0.5) * (TANK.w - 0.5),
                -TANK.h/2 + 0.1 + Math.random() * (WATER_Y - (-TANK.h/2 + 0.1)),
                (Math.random() - 0.5) * (TANK.d - 0.5)
            );
            bubble.userData = {
                speed: 0.02 + Math.random() * 0.03,
                drift: (Math.random() - 0.5) * 0.01
            };
            scene.add(bubble);
            bubbles.push(bubble);
        }

        // ==========================================
        // 5. 15 FULLY ANATOMICAL 3D FISH
        // ==========================================
        const fishColors = [0xff4422, 0xffaa00, 0x00ddff, 0x33ff88, 0xff0088, 0xaa00ff];

        function createFish() {
            const fishGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.SphereGeometry(1.0, 16, 16);
            // FIX: Randomize color from palette
            const color = fishColors[Math.floor(Math.random() * fishColors.length)];
            const bodyMat = new THREE.MeshPhysicalMaterial({ color: color, roughness: 0.2, metalness: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            fishGroup.add(body);

            // Caudal Tail Fin
            const tailGeo = new THREE.ConeGeometry(0.6, 1.2, 3);
            const tailMat = new THREE.MeshPhysicalMaterial({ color: 0x0088cc, roughness: 0.1 });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(0, 0, -1.8);
            tail.rotation.x = Math.PI / 2;
            fishGroup.add(tail);

            // Dorsal Top Fin
            const dorsalGeo = new THREE.ConeGeometry(0.3, 0.8, 3);
            const dorsal = new THREE.Mesh(dorsalGeo, tailMat);
            dorsal.position.set(0, 0.7, -0.2);
            dorsal.rotation.x = Math.PI / 2;
            fishGroup.add(dorsal);

            // Dual Eyes
            const eyeGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilGeo = new THREE.SphereGeometry(0.05, 16, 16);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const leftEye = new THREE.Group();
            const leftEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
            const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
            leftPupil.position.z = 0.05;
            leftEye.add(leftEyeMesh);
            leftEye.add(leftPupil);
            leftEye.position.set(0.38, 0.15, 0.9);
            fishGroup.add(leftEye);

            const rightEye = new THREE.Group();
            const rightEyeMesh = new THREE.Mesh(eyeGeo, eyeMat);
            const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
            rightPupil.position.z = 0.05;
            rightEye.add(rightEyeMesh);
            rightEye.add(rightPupil);
            rightEye.position.set(-0.38, 0.15, 0.9);
            fishGroup.add(rightEye);

            // Randomize starting position
            fishGroup.position.set(
                (Math.random() - 0.5) * (TANK.w - 1),
                (Math.random() - 0.5) * (WATER_Y - (-TANK.h/2 + 0.1)),
                (Math.random() - 0.5) * (TANK.d - 1)
            );

            // Randomize speed and direction
            fishGroup.userData = {
                speed: 0.05 + Math.random() * 0.05,
                direction: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
                phase: Math.random() * Math.PI * 2
            };

            scene.add(fishGroup);
            fishes.push(fishGroup);
        }

        for (let i = 0; i < 15; i++) {
            createFish();
        }

        // ==========================================
        // 6. 18 SWAYING GREEN SEAWEED PLANTS (FIXED)
        // ==========================================
        function createSeaweed() {
            const plantGroup = new THREE.Group();
            const height = 4 + Math.random() * 3;
            const segments = 10;
            // Create a plane geometry
            const geo = new THREE.PlaneGeometry(0.5, height);
            const mat = new THREE.MeshStandardMaterial({ color: 0x118833, roughness: 0.8, side: THREE.DoubleSide }); // FIX: DoubleSide
            const mesh = new THREE.Mesh(geo, mat);
            
            // FIX: Rotate to stand vertically upright
            mesh.rotation.x = 0; 
            mesh.position.y = height / 2; // Center the plant group vertically
            
            // Random position (adjusted for tank boundaries)
            plantGroup.position.set(
                (Math.random() - 0.5) * (TANK.w - 6),
                -TANK.h/2 + 0.1,
                (Math.random() - 0.5) * (TANK.d - 6)
            );

            // Add a userData property for animation phase
            plantGroup.userData = { phase: Math.random() * Math.PI * 2 };

            // FIX: Add mesh to group
            plantGroup.add(mesh);
            
            // FIX: Add group to scene
            scene.add(plantGroup);
            seaweeds.push(plantGroup);
        }

        for (let i = 0; i < 18; i++) {
            createSeaweed();
        }

        // ==========================================
        // 7. INTERACTIVE BUOYANT PHYSICS BALL
        // ==========================================
        const ballGeo = new THREE.SphereGeometry(1.8, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffff00, roughness: 0.1, metalness: 0.5 });
        ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        ball.position.y = -TANK.h/2 + 0.1;
        scene.add(ball);

        ballVel = new THREE.Vector3(0, 0, 0);

        // Raycaster for interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ==========================================
        // 8. 60 FPS requestAnimationFrame loop
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Update Bubbles
            bubbles.forEach(b => {
                b.position.y += b.userData.speed;
                b.position.x += b.userData.drift;
                if (b.position.y > WATER_Y) {
                    b.position.y = -TANK.h/2 + 0.1;
                    b.position.x = (Math.random() - 0.5) * (TANK.w - 0.5);
                    b.position.z = (Math.random() - 0.5) * (TANK.d - 0.5);
                }
            });

            // Update Seaweeds (FIXED: Swaying on Z axis)
            seaweeds.forEach(s => {
                // FIX: Access children[0] safely
                if (s.children && s.children.length > 0) {
                    s.children[0].rotation.z = Math.sin(time * 2 + s.userData.phase) * 0.15;
                }
            });

            // Update Fish
            fishes.forEach(f => {
                const fData = f.userData;
                f.position.add(fData.direction.clone().multiplyScalar(fData.speed));
                
                // FIX: Strict Boundary Collision Steering
                const fishMarginX = TANK.w/2 - 3.5;
                const fishMarginZ = TANK.d/2 - 3.5;
                const limitY = WATER_Y - 2.5;

                // X Axis
                if (f.position.x > fishMarginX) fData.direction.x -= 0.08;
                if (f.position.x < -fishMarginX) fData.direction.x += 0.08;
                
                // Z Axis
                if (f.position.z > fishMarginZ) fData.direction.z -= 0.08;
                if (f.position.z < -fishMarginZ) fData.direction.z += 0.08;
                
                // Y Axis
                if (f.position.y > limitY) fData.direction.y -= 0.06;
                if (f.position.y < -TANK.h/2 + 3.0) fData.direction.y += 0.06;

                // Normalize and apply
                fData.direction.normalize();
                f.position.add(fData.direction.clone().multiplyScalar(fData.speed));

                // Clamp Position Strictly (Tail Safety)
                // We clamp the head position, but since the tail is behind, 
                // we need to ensure the tail doesn't clip the glass.
                // The margin logic above handles the steering, but let's add a hard clamp for safety.
                
                // Clamp Head
                if (f.position.x > fishMarginX) f.position.x = fishMarginX;
                if (f.position.x < -fishMarginX) f.position.x = -fishMarginX;
                if (f.position.z > fishMarginZ) f.position.z = fishMarginZ;
                if (f.position.z < -fishMarginZ) f.position.z = -fishMarginZ;
                if (f.position.y > limitY) f.position.y = limitY;
                if (f.position.y < -TANK.h/2 + 3.0) f.position.y = -TANK.h/2 + 3.0;

                // Tail Wagging (Safe check)
                if (f.children && f.children.length > 1) {
                    f.children[1].rotation.y = Math.sin(time * 12 + f.userData.phase) * 0.45;
                }
            });

            // Update Ball Physics
            if (!isDraggingBall) {
                // Gravity
                ballVel.y -= 0.005;
                // Buoyancy (Archimedes)
                if (ball.position.y < WATER_Y + 1.8) {
                    ballVel.y += 0.008;
                }
                // Drag
                ballVel.multiplyScalar(0.98);
                
                ball.position.add(ballVel);

                // FIX: Strict Tank Boundary Clamping for Ball
                const limitX = TANK.w/2 - 1.8;
                const limitZ = TANK.d/2 - 1.8;

                // X Axis
                if (ball.position.x > limitX) {
                    ball.position.x = limitX;
                    ballVel.x *= -0.6;
                }
                if (ball.position.x < -limitX) {
                    ball.position.x = -limitX;
                    ballVel.x *= -0.6;
                }

                // Z Axis
                if (ball.position.z > limitZ) {
                    ball.position.z = limitZ;
                    ballVel.z *= -0.6;
                }
                if (ball.position.z < -limitZ) {
                    ball.position.z = -limitZ;
                    ballVel.z *= -0.6;
                }

                // Y Axis (Prevent flying into outer space)
                if (ball.position.y > WATER_Y + 4) {
                    ball.position.y = WATER_Y + 4;
                    ballVel.y = -0.5;
                }
                // Prevent flying below seabed
                if (ball.position.y < -TANK.h/2 + 1.8) {
                    ball.position.y = -TANK.h/2 + 1.8;
                    ballVel.y *= -0.5;
                }
            } else {
                // Dragging logic
                ball.position.y = ball.position.y + ballVel.y;
                ball.position.x = ball.position.x + ballVel.x;
                ball.position.z = ball.position.z + ballVel.z;
            }

            // Raycasting for interaction
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ball);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (intersect.distance < 3) {
                    ball.position.copy(intersect.point);
                    ball.position.y += 1.8; // Keep slightly above surface
                    ballVel.set(0, 0, 0);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ==========================================
        // EVENT LISTENERS & RESIZE
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        window.addEventListener('pointerdown', (event) => {
            if (event.target === renderer.domElement) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ball);
                if (intersects.length > 0) {
                    isDraggingBall = true;
                    ballVel.set(0, 0, 0);
                }
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (isDraggingBall) {
                mouse.x = (event.clientX / innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ball);
                if (intersects.length > 0) {
                    ball.position.copy(intersects[0].point);
                    ball.position.y += 1.8;
                }
            }
        });

        window.addEventListener('pointerup', () => {
            isDraggingBall = false;
            // Add fling velocity
            ballVel.set(
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2
            );
        });

        animate();
    </script>
</body>
</html>
