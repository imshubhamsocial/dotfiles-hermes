<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ Live Agent Preview & Hot-Reload</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07111a;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      #banner {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 9999;
        background: rgba(10, 25, 40, 0.75);
        border: 1px solid rgba(0, 220, 255, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 6px 14px;
        border-radius: 20px;
        color: #e0f4ff;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        user-select: none;
        pointer-events: none;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ffcc;
        box-shadow: 0 0 8px #00ffcc;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.8;
        }
      }
      .title {
        font-weight: 600;
        color: #00e5ff;
        letter-spacing: 0.5px;
      }
      .status {
        color: #88c0d0;
        font-size: 11px;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <div class="pulse-dot"></div>
      <span>Live Preview</span>
    </div>

    <iframe id="previewFrame" src="/build_preview.html"></iframe>

    <script>
      let lastMtime = null;
      const frame = document.getElementById("previewFrame");

      async function checkUpdate() {
        try {
          const res = await fetch("/api/version?t=" + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (lastMtime === null) {
              lastMtime = data.mtime;
            } else if (data.mtime !== lastMtime) {
              lastMtime = data.mtime;
              frame.src = "/build_preview.html?t=" + Date.now();
            }
          }
        } catch (e) {}
      }

      setInterval(checkUpdate, 1200);
      checkUpdate();
    </script>
  </body>
</html>
