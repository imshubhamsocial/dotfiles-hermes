<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaBench: AAA 3D WebGL Aquarium Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #062846; }
    canvas { display: block; }
  </style>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
let scene, camera, renderer, controls, ball, ballVel = new THREE.Vector3(0, 0, 0), isDraggingBall = false;
let fishes = [], seaweeds = [], bubbles = [];
let water;
const TANK = { w: 36, h: 22, d: 24 };
const WATER_Y = 6;

// Global eye material
const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.3 });
const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.1, transmission: 0.7, opacity: 0.6, transparent: true });

// Scene, Atmosphere & Shadows
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x062846);
  scene.fog = new THREE.FogExp2(0x062846, 0.015);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x225588, 1.5);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xaae5ff, 2.5);
  sunLight.position.set(15, 30, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  const bottomLight = new THREE.PointLight(0x00d2ff, 1.5, 30);
  bottomLight.position.set(0, -TANK.h / 2 + 1, 0);
  scene.add(bottomLight);

  const tankGeo = new THREE.BoxGeometry(TANK.w, TANK.h, TANK.d);
  const tankMat = new THREE.MeshPhysicalMaterial({ color: 0x99ddff, transparent: true, opacity: 0.15, roughness: 0.05, transmission: 0.9, depthWrite: false, side: THREE.DoubleSide });
  const tank = new THREE.Mesh(tankGeo, tankMat);
  scene.add(tank);

  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(tankGeo), new THREE.LineBasicMaterial({ color: 0x00ffff }));
  scene.add(edges);

  const sandGeo = new THREE.PlaneGeometry(TANK.w - 0.5, TANK.d - 0.5);
  const sandMat = new THREE.MeshStandardMaterial({ color: 0xd9b36c, roughness: 0.9 });
  const sand = new THREE.Mesh(sandGeo, sandMat);
  sand.rotation.x = -Math.PI / 2;
  sand.position.y = -TANK.h / 2 + 0.1;
  sand.receiveShadow = true;
  scene.add(sand);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 14, 42);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
}

// Spring-Mass Water Surface
function initWater() {
  const rows = 49, cols = 49;
  const waterGeo = new THREE.PlaneGeometry(TANK.w - 0.2, TANK.d - 0.2, 48, 48);
  const waterMat = new THREE.MeshPhysicalMaterial({ color: 0x0088cc, transparent: true, opacity: 0.55, roughness: 0.1, transmission: 0.8, depthWrite: false, side: THREE.DoubleSide });
  const heights = new Float32Array(rows * cols);
  const velocities = new Float32Array(rows * cols);
  water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = WATER_Y;
  water.geometry.userData = { heights, velocities, rows, cols };
  scene.add(water);
}

function getGridIndex(i, j) { return j * 49 + i; }

function triggerRipple(x, z, strength) {
  if (!water) return;
  const { heights, velocities, rows, cols } = water.geometry.userData;
  const gi = Math.floor(((x + (TANK.w - 0.2) / 2) / (TANK.w - 0.2)) * (cols - 1));
  const gj = Math.floor(((z + (TANK.d - 0.2) / 2) / (TANK.d - 0.2)) * (rows - 1));
  for (let dj = -2; dj <= 2; dj++) {
    for (let di = -2; di <= 2; di++) {
      const i = gi + di, j = gj + dj;
      if (i >= 0 && i < cols && j >= 0 && j < rows) {
        const d = Math.sqrt(di * di + dj * dj);
        if (d <= 2) {
          const idx = getGridIndex(i, j);
          velocities[idx] += strength * Math.cos(d * Math.PI * 0.25);
        }
      }
    }
  }
}

// Fish Class
const FISH_COLORS = [0xff3366, 0x00d2ff, 0xffaa00, 0x33cc66, 0x9933ff, 0xff0066, 0x00ffcc];

function initFishes() {
  for (let i = 0; i < 15; i++) {
    fishes.push(new Fish());
  }
}

class Fish {
  constructor() {
    this.color = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
    this.group = new THREE.Group();
    scene.add(this.group);

    const myBodyMat = new THREE.MeshPhysicalMaterial({ color: this.color, roughness: 0.3, metalness: 0.1 });
    const myFinMat = new THREE.MeshPhysicalMaterial({ color: this.color, roughness: 0.2, metalness: 0.2, transmission: 0.6 });

    const bodyGeo = new THREE.SphereGeometry(1.0, 16, 16);
    bodyGeo.scale(0.5, 0.7, 1.8);
    this.body = new THREE.Mesh(bodyGeo, myBodyMat);
    this.group.add(this.body);
    this.body.castShadow = true;

    const tailGeo = new THREE.ConeGeometry(0.6, 1.2, 3);
    this.tail = new THREE.Mesh(tailGeo, myFinMat);
    this.tail.scale.set(0.15, 1.2, 1.0);
    this.tail.rotation.x = Math.PI / 2;
    this.tail.position.z = -1.8;
    this.group.add(this.tail);
    this.tail.castShadow = true;

    const dorsalGeo = new THREE.ConeGeometry(0.4, 0.8, 3);
    this.dorsal = new THREE.Mesh(dorsalGeo, myFinMat);
    this.dorsal.scale.set(0.1, 1.0, 1.0);
    this.dorsal.position.set(0, 0.7, -0.2);
    this.group.add(this.dorsal);
    this.dorsal.castShadow = true;

    [-0.38, 0.38].forEach(sx => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
      eye.position.set(sx, 0.15, 0.9);
      this.group.add(eye);
      eye.castShadow = true;
    });

    this.group.position.set(
      (Math.random() - 0.5) * (TANK.w - 6),
      (Math.random() - 0.5) * 8 + 1,
      (Math.random() - 0.5) * (TANK.d - 6)
    );

    this.vel = new THREE.Vector3((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.3);
    this.phase = Math.random() * Math.PI * 2;
  }

  update(time, fishes, ball) {
    const separation = new THREE.Vector3();
    const alignment = new THREE.Vector3();
    const cohesion = new THREE.Vector3();
    const wallMargin = 2.5;
    const ballFleeDist = 6.0;
    let neighborCount = 0;

    for (let other of fishes) {
      if (other === this) continue;
      const dist = this.group.position.distanceTo(other.group.position);
      if (dist < 4.5 && dist > 0.01) {
        const diff = this.group.position.clone().sub(other.group.position);
        separation.add(diff.normalize().multiplyScalar((4.5 - dist) / dist));
        alignment.add(other.vel);
        cohesion.add(other.group.position);
        neighborCount++;
      }
    }

    if (neighborCount > 0) {
      alignment.divideScalar(neighborCount);
      cohesion.divideScalar(neighborCount).sub(this.group.position);

      this.vel.add(separation.multiplyScalar(0.05));
      this.vel.add(alignment.multiplyScalar(0.015));
      this.vel.add(cohesion.multiplyScalar(0.008));
    }

    if (ball) {
      const toBall = this.group.position.clone().sub(ball.position);
      const distToBall = toBall.length();
      if (distToBall < ballFleeDist && distToBall > 0.1) {
        this.vel.add(toBall.normalize().multiplyScalar(0.15));
      }
    }

    this.vel.clampLength(0.18, 0.45);
    this.vel.y = THREE.MathUtils.lerp(this.vel.y, 0, 0.03);
    this.group.position.add(this.vel);

    const xMax = TANK.w / 2 - wallMargin, zMax = TANK.d / 2 - wallMargin;
    const yMin = -TANK.h / 2 + 2, yMax = WATER_Y - 1.5;

    if (this.group.position.x < -xMax) { this.group.position.x = -xMax; this.vel.x *= -1; }
    if (this.group.position.x > xMax)  { this.group.position.x = xMax;  this.vel.x *= -1; }
    if (this.group.position.z < -zMax) { this.group.position.z = -zMax; this.vel.z *= -1; }
    if (this.group.position.z > zMax)  { this.group.position.z = zMax;  this.vel.z *= -1; }
    if (this.group.position.y < yMin)  { this.group.position.y = yMin;  this.vel.y *= -1; }
    if (this.group.position.y > yMax)  { this.group.position.y = yMax;  this.vel.y *= -1; }

    if (this.group.position.y > WATER_Y - 2.0) {
      triggerRipple(this.group.position.x, this.group.position.z, 0.35);
    }

    this.group.rotation.y = THREE.MathUtils.lerp(this.group.rotation.y, Math.atan2(-this.vel.x, -this.vel.z) + Math.PI, 0.08);
    this.tail.rotation.y = Math.sin(time * 12 + this.phase) * 0.45;
  }
}

// High-Density Seaweeds & Bubbles
function initSeaweeds() {
  for (let i = 0; i < 28; i++) {
    const height = 3 + Math.random() * 4.5;
    const geo = new THREE.PlaneGeometry(0.8, height, 1, 8);
    geo.translate(0, height / 2, 0);
    const mat = new THREE.MeshPhysicalMaterial({ color: 0x0a4d25, roughness: 0.8, transmission: 0.4, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * (TANK.w - 4),
      -TANK.h / 2 + 0.1,
      (Math.random() - 0.5) * (TANK.d - 4)
    );
    mesh.rotation.y = Math.random() * Math.PI * 2;
    mesh.userData = { offset: Math.random() * Math.PI * 2 };
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    seaweeds.push(mesh);
  }
}

function initBubbles() {
  for (let i = 0; i < 60; i++) {
    const geo = new THREE.SphereGeometry(0.12, 6, 6);
    const mesh = new THREE.Mesh(geo, bubbleMat);
    mesh.position.set(
      (Math.random() - 0.5) * (TANK.w - 2),
      -TANK.h / 2 + Math.random() * TANK.h,
      (Math.random() - 0.5) * (TANK.d - 2)
    );
    mesh.userData = { speed: 0.05 + Math.random() * 0.08 };
    scene.add(mesh);
    bubbles.push(mesh);
  }
}

// Buoyant Ball
function initBall() {
  const ballGeo = new THREE.SphereGeometry(1.8, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffff00, roughness: 0.2, metalness: 0.3 });
  ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(0, WATER_Y, 0);
  ball.castShadow = true;
  scene.add(ball);
}

let raycaster = new THREE.Raycaster();
let pointer = new THREE.Vector2();

function handleInteraction(e) {
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);

  if (e.type === 'pointerdown') {
    const intersects = raycaster.intersectObjects([water, ball]);
    if (intersects.length > 0) {
      const hit = intersects[0];
      if (hit.object === ball) {
        isDraggingBall = true;
        controls.enabled = false;
      } else {
        if (Math.abs(hit.point.x) < 17 && Math.abs(hit.point.z) < 11) {
          triggerRipple(hit.point.x, hit.point.z, 1.5);
        }
      }
    }
  } else if (e.type === 'pointermove') {
    if (isDraggingBall) {
      const target = new THREE.Vector3();
      raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion), -ball.position.dot(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion))), target);
      if (target) {
        target.x = Math.max(-TANK.w/2 + 2, Math.min(TANK.w/2 - 2, target.x));
        target.z = Math.max(-TANK.d/2 + 2, Math.min(TANK.d/2 - 2, target.z));
        target.y = Math.max(-TANK.h/2 + 2, Math.min(WATER_Y + 4, target.y));
        ballVel.subVectors(target, ball.position).multiplyScalar(15);
        ball.position.copy(target);
        triggerRipple(ball.position.x, ball.position.z, Math.min(2.0, ballVel.length() * 0.2));
      }
    }
  } else if (e.type === 'pointerup') {
    if (isDraggingBall) {
      isDraggingBall = false;
      controls.enabled = true;
      ballVel.clampLength(0, 20);
    }
  }
}

// animate() Loop
function animate() {
  requestAnimationFrame(animate);
  const time = performance.now() * 0.001;
  const dt = 0.016;

  const { heights, velocities, rows, cols } = water.geometry.userData;
  const k = 0.028, d = 0.965;
  for (let i = 0; i < heights.length; i++) {
    const idx = i, i_row = idx % 49, j_col = Math.floor(idx / 49);
    const neighbors = [];
    if (i_row > 0) neighbors.push(getGridIndex(i_row - 1, j_col));
    if (i_row < 48) neighbors.push(getGridIndex(i_row + 1, j_col));
    if (j_col > 0) neighbors.push(getGridIndex(i_row, j_col - 1));
    if (j_col < 48) neighbors.push(getGridIndex(i_row, j_col + 1));
    const avgH = neighbors.reduce((sum, n) => sum + heights[n], 0) / neighbors.length;
    velocities[idx] = (velocities[idx] + (avgH - heights[idx]) * k) * d;
    heights[idx] += velocities[idx];
    water.geometry.attributes.position.setZ(idx, heights[idx]);
  }
  water.geometry.attributes.position.needsUpdate = true;
  water.geometry.computeVertexNormals();

  if (!isDraggingBall) {
    const submergedDepth = Math.max(0, (WATER_Y + 1.8) - ball.position.y);
    const buoyancy = Math.min(submergedDepth / 3.6, 2.5) * 32.0;
    ballVel.y += (buoyancy - 16.0) * dt;
    if (ball.position.y < WATER_Y + 1.8) {
      ballVel.multiplyScalar(0.97);
      if (Math.abs(ballVel.y) > 0.5) {
        triggerRipple(ball.position.x, ball.position.z, Math.min(2.5, Math.abs(ballVel.y) * 0.25));
      }
    }
    ball.position.addScaledVector(ballVel, dt);

    if (Math.abs(ball.position.x) > (TANK.w / 2 - 2)) { ball.position.x = Math.sign(ball.position.x) * (TANK.w/2 - 2); ballVel.x *= -0.8; }
    if (Math.abs(ball.position.z) > (TANK.d / 2 - 2)) { ball.position.z = Math.sign(ball.position.z) * (TANK.d/2 - 2); ballVel.z *= -0.8; }
    if (ball.position.y <= -TANK.h / 2 + 2) {
      ball.position.y = -TANK.h / 2 + 2;
      ballVel.y *= -0.5;
    }
  }

  fishes.forEach(f => f.update(time, fishes, ball));
  seaweeds.forEach(s => { s.rotation.z = Math.sin(time * 1.5 + s.userData.offset) * 0.18; });
  bubbles.forEach(b => {
    b.position.y += b.userData.speed;
    if (b.position.y > WATER_Y) b.position.y = -TANK.h / 2;
  });

  controls.update();
  renderer.render(scene, camera);
}

// DOM Initialization
window.addEventListener('DOMContentLoaded', () => {
  initScene();
  initWater();
  initFishes();
  initSeaweeds();
  initBubbles();
  initBall();
  window.addEventListener('pointerdown', handleInteraction);
  window.addEventListener('pointermove', handleInteraction);
  window.addEventListener('pointerup', handleInteraction);
  window.addEventListener('contextmenu', e => e.preventDefault());
  animate();
});
</script>
</body>
</html>
